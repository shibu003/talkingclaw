name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # 画面の静的チェック。daemon も音声エンジンも npm install も要らない
      # (test/check-*.mjs は node: の組み込みモジュールしか使わない)
      - run: npm run check-ui
