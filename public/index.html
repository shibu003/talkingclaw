<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; media-src 'self'; img-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'none'">
<meta name="room-token" content="__ROOM_TOKEN__">
<meta name="room-boot" content="__BOOT_ID__">
<title>talkingclaw — 声の部屋</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; background: #16121f; color: #eae6f2;
         display: flex; flex-direction: column; height: 100dvh; max-width: 760px; margin: 0 auto; }
  header { padding: 14px 18px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 16px; font-weight: 600; }
  #status { font-size: 12px; color: #9a8fb8; margin-left: auto; }
  #log { flex: 1; overflow-y: auto; padding: 8px 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; line-height: 1.6; font-size: 15px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #3d3356; border-bottom-right-radius: 4px; }
  .agent { align-self: flex-start; background: #241d33; border-bottom-left-radius: 4px; }
  .agent.speaking { outline: 1px solid #b48ef7; }
  .agent .who { display: block; font-size: 11px; color: #9a8fb8; margin-bottom: 2px; }
  .sys { align-self: center; color: #9a8fb8; font-size: 12px; }
  .interim { align-self: flex-end; color: #9a8fb8; font-size: 14px; padding: 0 14px; }
  footer { padding: 12px 18px 18px; display: flex; gap: 10px; align-items: center; }
  #mic { width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
         background: #3d3356; color: #eae6f2; font-size: 24px; flex-shrink: 0; transition: background .2s; }
  #mic.on { background: #b48ef7; color: #16121f; }
  #mic.listening { background: #e75480; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  #text { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid #3d3356; background: #241d33; color: #eae6f2; font-size: 15px; outline: none; }
  #notice { padding: 8px 18px; color: #e75480; font-size: 13px; display: none; }
  #roster { display: flex; gap: 8px; padding: 0 18px 6px; flex-wrap: wrap; }
  .chip { padding: 4px 12px; border-radius: 14px; background: #241d33; color: #9a8fb8;
          font-size: 12px; cursor: pointer; border: 1px solid #3d3356; user-select: none; }
  .chip.active { color: #eae6f2; }
  .chip.selected { background: #b48ef7; color: #16121f; border-color: #b48ef7; }
  .chip.gone { opacity: .45; }
</style>
</head>
<body>
<header>
  <h1>声の部屋</h1>
  <div id="status">接続中…</div>
</header>
<div id="notice"></div>
<div id="roster"></div>
<div id="log"></div>
<footer>
  <button id="mic" title="ハンズフリー会話 ON/OFF">🎤</button>
  <input id="text" placeholder="テキストでも話しかけられるよ" autocomplete="off">
</footer>
<script src="/vad/vad-web.js"></script>
<script src="/room.js"></script>
</body>
</html>
