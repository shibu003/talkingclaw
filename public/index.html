<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; media-src 'self'; img-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'none'">
<meta name="room-token" content="__ROOM_TOKEN__">
<meta name="room-boot" content="__BOOT_ID__">
<title>talkingclaw — 声の部屋</title>
<style>
  /* 声の部屋のデザイン。色・間隔はここの変数だけを触れば全体が揃う */
  :root {
    color-scheme: dark;
    --bg: #14101c; --surface: #1d1729; --surface-2: #241d33; --line: #372d4d;
    --text: #eae6f2; --muted: #9a8fb8; --accent: #b48ef7; --accent-ink: #16121f; --hot: #e75480;
    --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --pad: 16px;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; background: var(--bg); color: var(--text);
         display: flex; flex-direction: column; height: 100dvh; max-width: 820px; margin: 0 auto;
         -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- ヘッダ: 部屋の名前が主役。道具は右にまとめる ---- */
  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
           padding: 10px var(--pad); border-bottom: 1px solid var(--line); background: var(--bg); }
  #roomBtn { display: flex; align-items: center; gap: 8px; max-width: 60vw;
             padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
             background: var(--surface-2); font-size: 15px; font-weight: 600; }
  #roomBtn:hover { border-color: var(--accent); }
  #roomBtn .caret { color: var(--muted); font-size: 11px; }
  #roomBtn .rname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { font-size: 12px; color: var(--muted); margin-left: auto; text-align: right; }
  .tools { display: flex; gap: 4px; }
  .hbtn { background: transparent; border: 1px solid transparent; color: var(--muted);
          border-radius: var(--r-sm); padding: 6px 9px; font-size: 15px; line-height: 1; }
  .hbtn:hover { background: var(--surface-2); color: var(--text); }
  .hbtn[aria-expanded="true"] { background: var(--surface-2); border-color: var(--accent); color: var(--text); }

  #notice { margin: 8px var(--pad) 0; padding: 8px 12px; border-radius: var(--r-sm);
            background: #3a1b28; color: #ffb7c9; font-size: 13px; display: none; }

  /* ---- 話す相手 ---- */
  #roster { display: flex; gap: 6px; padding: 8px var(--pad) 0; flex-wrap: wrap; align-items: center; }
  #roster .label { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .chip { padding: 4px 12px; border-radius: 999px; background: var(--surface-2); color: var(--muted);
          font-size: 12px; cursor: pointer; border: 1px solid var(--line); user-select: none; }
  .chip:hover { border-color: var(--accent); }
  .chip.active { color: var(--text); }
  .chip.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chip.gone { opacity: .45; }

  /* ---- パネル(部屋・ボード・設定は同時に 1 枚だけ開く)---- */
  .panel { display: none; margin: 8px var(--pad) 0; padding: 12px 14px; background: var(--surface);
           border: 1px solid var(--line); border-radius: var(--r-md); font-size: 13px;
           max-height: 42dvh; overflow-y: auto; }
  .panel.open { display: block; }
  .panel h2 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--surface-2); }
  .row:last-child { border-bottom: 0; }

  /* 部屋一覧 */
  .room { width: 100%; text-align: left; display: flex; align-items: center; gap: 10px;
          padding: 10px 12px; margin-bottom: 6px; border-radius: var(--r-sm);
          border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; }
  .room:hover { border-color: var(--accent); }
  .room.here { border-color: var(--accent); background: #2c2340; }
  .room .here-mark { margin-left: auto; font-size: 11px; color: var(--accent); }
  #roomsExtra:empty { display: none; }   /* 新規作成・名前変更 UI のマウント先 */

  /* 作業ボード */
  .task { padding: 8px 0; border-bottom: 1px solid var(--surface-2); font-size: 13px; line-height: 1.5; }
  .task:last-child { border-bottom: 0; }
  .task .tstat { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); margin-right: 6px; }
  .task .tstat.done { background: #2e5d3a; } .task .tstat.failed { background: #6b2f3d; }
  .task .tnote { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }
  .task a { color: var(--accent); }
  .tnote { color: var(--muted); font-size: 12px; }

  /* 設定 */
  #settings label { display: inline-flex; align-items: center; gap: 6px; margin: 0 14px 8px 0; color: var(--muted); }
  #settings select, #settings input { background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 4px 8px; }

  /* ---- 会話ログ ---- */
  #log { flex: 1; overflow-y: auto; padding: 12px var(--pad); display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: var(--r-lg); line-height: 1.65; font-size: 15px; white-space: pre-wrap;
         overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: #3d3356; border-bottom-right-radius: 4px; }
  .agent { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
  .agent.speaking { box-shadow: 0 0 0 1px var(--accent), 0 0 18px -6px var(--accent); }
  .agent .who { display: block; font-size: 11px; color: var(--accent); margin-bottom: 3px; }
  .user .to { display: block; font-size: 10px; color: var(--muted); text-align: right; margin-top: 3px; }
  .sys { align-self: center; color: var(--muted); font-size: 12px; text-align: center;
         background: var(--surface); border-radius: 999px; padding: 3px 12px; }
  .interim { align-self: flex-end; color: var(--muted); font-size: 14px; padding: 0 14px; }

  /* ---- 入力 ---- */
  footer { padding: 10px var(--pad) calc(10px + env(safe-area-inset-bottom));
           display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); }
  #mic { width: 54px; height: 54px; border-radius: 50%; border: none; background: var(--surface-2);
         font-size: 23px; flex-shrink: 0; transition: background .2s, transform .2s; }
  #mic.on { background: var(--accent); color: var(--accent-ink); }
  #mic.listening { background: var(--hot); color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  #text { flex: 1; min-width: 0; padding: 13px 16px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--surface-2); font-size: 15px; outline: none; }
  #text:focus { border-color: var(--accent); }
  #send { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
          background: var(--surface-2); font-size: 16px; flex-shrink: 0; }
  #send:hover { border-color: var(--accent); }

  /* ---- 成果物プレビュー ---- */
  #preview { display: none; position: fixed; right: 0; top: 0; width: min(560px, 92vw); height: 100dvh;
             background: var(--surface); border-left: 1px solid var(--line); z-index: 10; flex-direction: column; }
  #preview.open { display: flex; }
  #preview .phead { display: flex; gap: 8px; align-items: center; padding: 10px 12px; font-size: 13px;
                    border-bottom: 1px solid var(--line); }
  #preview .phead #previewTitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #preview .phead a { color: var(--accent); margin-left: auto; flex-shrink: 0; }
  #preview iframe { flex: 1; border: 0; background: #fff; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <button id="roomBtn" title="部屋を選ぶ" aria-expanded="false">
    <span class="rname">部屋</span><span class="caret">▼</span>
  </button>
  <div id="status">接続中…</div>
  <div class="tools">
    <button id="boardBtn" class="hbtn" title="作業ボード" aria-expanded="false">📋</button>
    <button id="settingsBtn" class="hbtn" title="設定" aria-expanded="false">⚙</button>
    <button id="logBtn" class="hbtn" title="この部屋の会話ログ">📄</button>
    <button id="archiveBtn" class="hbtn" title="アーカイブ一覧">🗄</button>
  </div>
</header>
<div id="notice"></div>
<div id="roster"></div>
<div id="rooms" class="panel">
  <h2>部屋</h2>
  <div id="roomList"></div>
  <div id="roomsExtra"></div>
</div>
<div id="board" class="panel"><h2>作業ボード</h2><div id="boardList"></div></div>
<div id="settings" class="panel"><h2>設定</h2><div id="settingsBody"></div></div>
<div id="preview">
  <div class="phead">
    <button id="previewClose" class="hbtn">✕</button>
    <span id="previewTitle"></span>
    <a id="previewOpen" target="_blank">別タブで開く</a>
  </div>
  <iframe id="previewFrame" title="成果物プレビュー"></iframe>
</div>
<div id="log"></div>
<footer>
  <button id="mic" title="ハンズフリー会話 ON/OFF">🎤</button>
  <input id="text" placeholder="テキストでも話しかけられるよ" autocomplete="off">
  <button id="send" title="送信">➤</button>
</footer>
<script src="/vad/vad-web.js"></script>
<script src="/room.js"></script>
</body>
</html>
