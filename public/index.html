<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; media-src 'self'; img-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'none'">
<meta name="room-token" content="__ROOM_TOKEN__">
<meta name="room-boot" content="__BOOT_ID__">
<title>talkingclaw — 声の部屋</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; background: #16121f; color: #eae6f2;
         display: flex; flex-direction: column; height: 100dvh; max-width: 760px; margin: 0 auto; }
  header { padding: 14px 18px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 16px; font-weight: 600; }
  #status { font-size: 12px; color: #9a8fb8; margin-left: auto; }
  #log { flex: 1; overflow-y: auto; padding: 8px 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; line-height: 1.6; font-size: 15px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #3d3356; border-bottom-right-radius: 4px; }
  .agent { align-self: flex-start; background: #241d33; border-bottom-left-radius: 4px; }
  .agent.speaking { outline: 1px solid #b48ef7; }
  .agent .who { display: block; font-size: 11px; color: #9a8fb8; margin-bottom: 2px; }
  .sys { align-self: center; color: #9a8fb8; font-size: 12px; }
  .interim { align-self: flex-end; color: #9a8fb8; font-size: 14px; padding: 0 14px; }
  footer { padding: 12px 18px 18px; display: flex; gap: 10px; align-items: center; }
  #mic { width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
         background: #3d3356; color: #eae6f2; font-size: 24px; flex-shrink: 0; transition: background .2s; }
  #mic.on { background: #b48ef7; color: #16121f; }
  #mic.listening { background: #e75480; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  #text { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid #3d3356; background: #241d33; color: #eae6f2; font-size: 15px; outline: none; }
  #notice { padding: 8px 18px; color: #e75480; font-size: 13px; display: none; }
  .hbtn { background: #241d33; border: 1px solid #3d3356; color: #eae6f2; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  #roster { display: flex; gap: 8px; padding: 0 18px 6px; flex-wrap: wrap; align-items: center; }
  #roster .label { font-size: 12px; color: #9a8fb8; }
  #board { display: none; margin: 0 18px 8px; padding: 10px 12px; background: #1d1729; border: 1px solid #3d3356; border-radius: 12px; max-height: 32dvh; overflow-y: auto; }
  .task { padding: 6px 0; border-bottom: 1px solid #241d33; font-size: 13px; }
  .task .tstat { font-size: 11px; padding: 1px 8px; border-radius: 8px; background: #3d3356; margin-right: 6px; }
  .task .tstat.done { background: #2e5d3a; } .task .tstat.failed { background: #6b2f3d; }
  .task .tnote { color: #9a8fb8; font-size: 12px; display: block; }
  .task a { color: #b48ef7; }
  .user .to { display: block; font-size: 10px; color: #9a8fb8; text-align: right; margin-top: 2px; }
  #settings { display: none; margin: 0 18px 8px; padding: 10px 12px; background: #1d1729; border: 1px solid #3d3356; border-radius: 12px; font-size: 13px; }
  #settings label { margin-right: 14px; }
  #settings select { background: #241d33; color: #eae6f2; border: 1px solid #3d3356; border-radius: 6px; padding: 2px 6px; }
  #preview { display: none; position: fixed; right: 0; top: 0; width: min(560px, 90vw); height: 100dvh;
             background: #1d1729; border-left: 1px solid #3d3356; z-index: 10; flex-direction: column; }
  #preview.open { display: flex; }
  #preview .phead { display: flex; gap: 8px; align-items: center; padding: 10px 12px; font-size: 13px; }
  #preview .phead a { color: #b48ef7; margin-left: auto; }
  #preview iframe { flex: 1; border: 0; background: #fff; }
  .chip { padding: 4px 12px; border-radius: 14px; background: #241d33; color: #9a8fb8;
          font-size: 12px; cursor: pointer; border: 1px solid #3d3356; user-select: none; }
  .chip.active { color: #eae6f2; }
  .chip.selected { background: #b48ef7; color: #16121f; border-color: #b48ef7; }
  .chip.gone { opacity: .45; }
</style>
</head>
<body>
<header>
  <h1>声の部屋</h1>
  <button id="roomBtn" class="hbtn" title="部屋を切り替え(作業部屋/雑談部屋)">🛠 作業部屋</button>
  <button id="boardBtn" class="hbtn" title="作業ボード">📋</button>
  <button id="settingsBtn" class="hbtn" title="worker 設定">⚙</button>
  <button id="logBtn" class="hbtn" title="会話ログ">📄</button>
  <button id="archiveBtn" class="hbtn" title="アーカイブ一覧">🗄</button>
  <div id="status">接続中…</div>
</header>
<div id="notice"></div>
<div id="roster"></div>
<div id="board"></div>
<div id="settings"></div>
<div id="preview">
  <div class="phead">
    <button id="previewClose" class="hbtn">✕</button>
    <span id="previewTitle"></span>
    <a id="previewOpen" target="_blank">別タブで開く</a>
  </div>
  <iframe id="previewFrame" title="成果物プレビュー"></iframe>
</div>
<div id="log"></div>
<footer>
  <button id="mic" title="ハンズフリー会話 ON/OFF">🎤</button>
  <input id="text" placeholder="テキストでも話しかけられるよ" autocomplete="off">
</footer>
<script src="/vad/vad-web.js"></script>
<script src="/room.js"></script>
</body>
</html>
