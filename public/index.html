<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>talkingclaw — クロエ</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #16121f; color: #eae6f2;
    display: flex; flex-direction: column; height: 100dvh; max-width: 720px; margin: 0 auto;
  }
  header { padding: 14px 18px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 16px; font-weight: 600; }
  #status { font-size: 12px; color: #9a8fb8; margin-left: auto; }
  #log { flex: 1; overflow-y: auto; padding: 8px 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; line-height: 1.6; font-size: 15px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #3d3356; border-bottom-right-radius: 4px; }
  .chloe { align-self: flex-start; background: #241d33; border-bottom-left-radius: 4px; }
  .chloe.speaking { outline: 1px solid #b48ef7; }
  .interim { align-self: flex-end; color: #9a8fb8; font-size: 14px; padding: 0 14px; }
  footer { padding: 12px 18px 18px; display: flex; gap: 10px; align-items: center; }
  #mic {
    width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
    background: #3d3356; color: #eae6f2; font-size: 24px; flex-shrink: 0; transition: background .2s;
  }
  #mic.on { background: #b48ef7; color: #16121f; }
  #mic.listening { background: #e75480; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  #text { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid #3d3356; background: #241d33; color: #eae6f2; font-size: 15px; outline: none; }
  #unsupported { padding: 8px 18px; color: #e75480; font-size: 13px; display: none; }
</style>
</head>
<body>
<header>
  <h1>クロエ</h1>
  <div id="status">接続中…</div>
</header>
<div id="unsupported">このブラウザは音声認識に未対応です。Chrome を使うか、テキスト入力してください。</div>
<div id="log"></div>
<footer>
  <button id="mic" title="ハンズフリー会話 ON/OFF">🎤</button>
  <input id="text" placeholder="テキストでも話しかけられるよ" autocomplete="off">
</footer>
<script>
const log = document.getElementById('log');
const status = document.getElementById('status');
const micBtn = document.getElementById('mic');
const textInput = document.getElementById('text');

let lastEventId = 0;
let handsfree = false;      // ユーザーが 🎤 を ON にしているか
let listening = false;      // SpeechRecognition が動いているか
let audioQueue = [];        // 再生待ちの {url, bubble}
let playing = false;
let currentBubble = null;   // 生成中のクロエ吹き出し

function addMsg(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}
function setStatus(text) { status.textContent = text; }

// ---- クロエの音声を順次再生。再生中はマイクを止めてエコー拾いを防ぐ ----
function playNext() {
  const next = audioQueue.shift();
  if (!next) {
    playing = false;
    document.querySelectorAll('.chloe.speaking').forEach(el => el.classList.remove('speaking'));
    resumeMic();
    return;
  }
  playing = true;
  pauseMic();
  next.bubble.classList.add('speaking');
  const audio = new Audio(next.url);
  let advanced = false;
  const advance = () => {
    if (advanced) return; // onended と onerror の二重発火でキューを飛ばさない
    advanced = true;
    next.bubble.classList.remove('speaking');
    playNext();
  };
  audio.onended = audio.onerror = advance;
  audio.play().catch(advance);
}
function enqueueAudio(url, bubble) {
  audioQueue.push({ url, bubble });
  if (!playing) playNext();
}

// ---- SSE でクロエの文を受信 ----
const events = new EventSource('/events');
events.onopen = () => setStatus(handsfree ? '聞いてるよ' : '🎤 でハンズフリー開始');
events.onerror = () => setStatus('サーバと再接続中…');
events.onmessage = (e) => {
  const ev = JSON.parse(e.data);
  if (ev.id <= lastEventId) return; // 履歴 replay との重複排除
  lastEventId = ev.id;
  if (ev.type === 'sentence') {
    if (!currentBubble) currentBubble = addMsg('chloe', '');
    currentBubble.textContent += (currentBubble.textContent ? ' ' : '') + ev.text;
    log.scrollTop = log.scrollHeight;
    if (ev.audio) enqueueAudio(ev.audio, currentBubble);
  } else if (ev.type === 'done') {
    currentBubble = null;
  } else if (ev.type === 'error') {
    addMsg('chloe', 'ごめん、エラーが出ちゃった: ' + ev.message);
    currentBubble = null;
  }
};

// ---- 発話をサーバへ ----
async function send(text) {
  text = text.trim();
  if (!text) return;
  addMsg('user', text);
  setStatus('考え中…');
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      addMsg('chloe', body.error || 'サーバエラーだよ、ごめんね。');
    }
  } catch {
    addMsg('chloe', 'サーバに繋がらないみたい。npm run web は動いてる?');
  }
}
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.isComposing) { send(textInput.value); textInput.value = ''; }
});

// ---- 音声認識(Web Speech API) ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let interimEl = null;

if (!SR) {
  document.getElementById('unsupported').style.display = 'block';
  micBtn.disabled = true;
} else {
  recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onstart = () => { listening = true; micBtn.classList.add('listening'); setStatus('聞いてるよ'); };
  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('listening');
    interimEl?.remove(); interimEl = null;
    // ハンズフリー中で、クロエが喋っていなければ聞き直す(no-speech 等で勝手に止まるため)
    if (handsfree && !playing) setTimeout(() => { if (handsfree && !playing && !listening) startMic(); }, 300);
  };
  recognition.onerror = (e) => {
    if (e.error === 'not-allowed') {
      handsfree = false;
      micBtn.classList.remove('on');
      setStatus('マイクの使用が許可されていません');
    }
  };
  recognition.onresult = (e) => {
    let finalText = '', interim = '';
    for (const result of e.results) (result.isFinal ? finalText += result[0].transcript : interim += result[0].transcript);
    if (interim) {
      if (!interimEl) interimEl = Object.assign(document.createElement('div'), { className: 'interim' });
      interimEl.textContent = interim + '…';
      log.appendChild(interimEl);
      log.scrollTop = log.scrollHeight;
    }
    if (finalText) {
      interimEl?.remove(); interimEl = null;
      send(finalText);
    }
  };
}

function startMic() { try { recognition.start(); } catch { /* already started */ } }
function pauseMic() { if (recognition && listening) recognition.abort(); }
function resumeMic() { if (handsfree && !listening) startMic(); setStatus(handsfree ? '聞いてるよ' : '🎤 でハンズフリー開始'); }

micBtn.addEventListener('click', () => {
  handsfree = !handsfree;
  micBtn.classList.toggle('on', handsfree);
  if (handsfree) startMic();
  else { pauseMic(); setStatus('🎤 でハンズフリー開始'); }
});
</script>
</body>
</html>
