<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- media-src に blob: が要る: 試聴(PBI-008)は POST の応答 WAV を Blob URL で鳴らすため
     (会話の音は /audio/N なので 'self' のまま)。frame-ancestors は meta では無視されるので
     置かない — 埋め込み拒否はサーバが送る X-Frame-Options: DENY が担う(room.ts の / 配信) -->
<!-- PBI-022: VRM のテクスチャは GLTFLoader が blob: を作って読む。外部 origin は増やしていない
     (connect/img に blob: を足しただけ。self 以外のホストへは相変わらず出られない) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' '__IMPORTMAP_HASH__'; connect-src 'self' blob:; media-src 'self' blob:; img-src 'self' blob: data:; style-src 'unsafe-inline'">
<meta name="room-token" content="__ROOM_TOKEN__">
<!-- PBI-040: この画面の主が誰か。**起動時に分かる**必要がある(後から分かるとホスト用の口を叩いてしまう) -->
<meta name="room-role" content="__ROOM_ROLE__">
<meta name="room-boot" content="__BOOT_ID__">
<title>talkingclaw — 声の部屋</title>
<style>
  /* 声の部屋のデザイン。読みやすさ優先 —
     ① 文字は本文 17px / 補助 13.5px 下限 / 行間 1.8、② 1 行は 30em 以内、
     ③ コントラストは本文 7:1・補助 5.5:1 以上(npm test で検査)、
     ④ 階層は「大きさ」より「余白と色」で作る。色・寸法はこの変数だけ触れば全体が揃う */
  :root {
    color-scheme: dark;
    --bg: #14101c; --surface: #1f1930; --surface-2: #2a2240; --line: #453a63;
    --text: #f6f3fb; --muted: #c9c0e2; --accent: #cdb2ff; --accent-ink: #17111f; --hot: #ff7fa2;
    --r-sm: 8px; --r-md: 14px; --r-lg: 20px; --pad: 18px;
    --fs-body: 17px; --fs-ui: 15px; --fs-small: 13.5px;
    --measure: 30em;   /* 1 行の最大文字数(和文で読み疲れない幅) */
  }
  * { box-sizing: border-box; margin: 0; }
  /* スクロールバーは動かしている時だけ見せる(いつも出ていると画面が騒がしい)。
     幅は取り続けるので、出た瞬間に中身がずれることはない */
  * { scrollbar-width: thin; scrollbar-color: transparent transparent; }
  *:hover, *:focus-within { scrollbar-color: var(--line) transparent; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: transparent; border-radius: 999px;
                              border: 2px solid transparent; background-clip: content-box; }
  :hover::-webkit-scrollbar-thumb { background: var(--line); background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); background-clip: content-box; }
  body { font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
         background: var(--bg); color: var(--text);
         font-size: var(--fs-body); line-height: 1.8; letter-spacing: .015em;
         display: flex; flex-direction: column; height: 100dvh; max-width: 860px; margin: 0 auto;
         -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- ヘッダ: いる部屋の名前が最上位。状態と道具はその下の階層 ---- */
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
           padding: 12px var(--pad); border-bottom: 1px solid var(--line); }
  #roomBtn { display: flex; align-items: baseline; gap: 8px; max-width: 58vw;
             padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line);
             background: var(--surface-2); font-size: 19px; font-weight: 700; line-height: 1.3; }
  #roomBtn:hover { border-color: var(--accent); }
  #roomBtn .rname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #roomBtn .caret { color: var(--muted); font-size: 12px; }
  /* 見出しの頂点。今どの部屋を見ているかを文書構造としても示す */
  #roomTitle { display: none; font-size: var(--fs-ui); font-weight: 700; line-height: 1.4;
               letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { font-size: var(--fs-small); line-height: 1.5; color: var(--muted); margin-left: auto; text-align: right; }
  /* PBI-021: 相棒の 9 軸。会話ログを覆わない(header の中に収める) */
  #personaBtn { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: var(--fs-small); white-space: nowrap; }
  #personaBtn #personaTop { color: var(--muted); }
  #status { font-size: var(--fs-small); line-height: 1.5; color: var(--muted); text-align: right; }
  #personaPanel { padding: 6px var(--pad) 0; font-size: var(--fs-small); color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; }
  #personaPanel.hidden { display: none; }
  /* PBI-024: 「これ覚える?」の 1 行。押せる的は 44px 以上(既存の規約) */
  #vocabBar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px var(--pad) 0; font-size: var(--fs-small); color: var(--muted); }
  #vocabBar[hidden] { display: none; }
  #vocabBar .vword { display: inline-flex; align-items: center; gap: 4px; }
  #vocabBar button { min-height: 32px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--fg, inherit); cursor: pointer; }
  #vocabBar button.no { padding: 4px 8px; color: var(--muted); }
  @media (pointer: coarse) { #vocabBar button { min-height: 44px; } }
  /* PBI-022: キャラ。狭い画面では 30dvh までに抑えて #log を潰さない(.panel の既定と同じ考え方) */
  #avatarCanvas { display: block; width: 100%; height: 260px; max-height: 30dvh; }
  #avatar .anote { margin-top: 6px; font-size: var(--fs-small); color: var(--muted); }
  /* PBI-025: 動きのボタン。押せる的は 44px 以上(既存の規約) */
  #motionBar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #motionBar button { min-height: 32px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--fg, inherit); font-size: var(--fs-small); cursor: pointer; }
  @media (pointer: coarse) { #motionBar button { min-height: 44px; } }
  @media (min-width: 1100px) { #avatarCanvas { height: 380px; max-height: 44dvh; } }
  #personaPanel b { color: var(--fg, inherit); font-weight: 600; }
  .tools { display: flex; gap: 2px; }
  /* 触れる的は 44px 以上。見た目のアイコンは小さいままで、押せる範囲だけ広げる */
  .hbtn { background: transparent; border: 1px solid transparent; color: var(--muted);
          border-radius: var(--r-sm); padding: 7px 10px; font-size: 16px; line-height: 1;
          min-width: 44px; min-height: 44px; }
  .hbtn:hover { background: var(--surface-2); color: var(--text); }
  .hbtn[aria-expanded="true"] { background: var(--surface-2); border-color: var(--accent); color: var(--text); }

  #notice { margin: 10px var(--pad) 0; padding: 10px 14px; border-radius: var(--r-sm);
            background: #3d1c2b; color: #ffc2d1; font-size: var(--fs-ui); line-height: 1.7; display: none; }

  /* PBI-017: フォルダをドラッグしている間だけ、画面の上端に帯を出す(会話は覆わない)。
     落とし口を探させないための合図で、実際は画面のどこに落としてもいい */
  body.dragging::before { content: 'フォルダを落とすと作業先になるよ(どこに落としてもいい)';
            position: fixed; inset: 0 0 auto 0; z-index: 60; padding: 12px var(--pad);
            background: var(--accent, #4a7bd6); color: #fff; font-size: var(--fs-ui); text-align: center;
            pointer-events: none; }
  body.dragging { outline: 3px dashed var(--accent, #4a7bd6); outline-offset: -3px; }

  /* ---- 話す相手 ---- */
  #roster { display: flex; gap: 6px; padding: 10px var(--pad) 0; flex-wrap: wrap; align-items: center; }
  #roster.hidden { display: none; }
  #roster .label { font-size: var(--fs-small); color: var(--muted); margin-right: 2px; }
  .chip { padding: 5px 13px; border-radius: 999px; background: var(--surface-2); color: var(--muted);
          font-size: var(--fs-small); line-height: 1.5; cursor: pointer; border: 1px solid var(--line); user-select: none; }
  .chip:hover { border-color: var(--accent); }
  .chip.active { color: var(--text); }
  .chip.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .chip.gone { opacity: .5; }
  /* 別の部屋にいる相手はグレー。押すと「呼ぶ?」が出る */
  .chip.away { opacity: .55; border-style: dashed; }
  .chip .where { margin-left: 6px; font-size: 12px; color: var(--muted); }
  .invite { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; width: 100%; margin-top: 8px;
            font-size: var(--fs-small); line-height: 1.5; color: var(--muted); }

  /* ---- パネル(部屋・ボード・設定は同時に 1 枚だけ)---- */
  .panel { display: none; margin: 10px var(--pad) 0; padding: 14px 16px; background: var(--surface);
           border: 1px solid var(--line); border-radius: var(--r-md);
           font-size: var(--fs-ui); max-height: 44dvh; overflow-y: auto; overflow-x: hidden; }
  .panel.open { display: block; }
  .panel h2 { display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
              font-size: var(--fs-small); font-weight: 700; letter-spacing: .1em; color: var(--muted); }
  .panel h2::before { content: ""; width: 3px; height: 13px; border-radius: 2px; background: var(--accent); }

  /* ---- 声を選ぶ(PBI-008 AC-10)----
     測って決めた形: 上限 30dvh。44dvh(.panel 既定)だと 390x844 で #log が 286px となり
     35dvh(295px)を 9px 下回る。30dvh ならパネル 253px / #log 316px で満たす(実測)。
     パネル自身は overflow:hidden の縦積みにして、**内部 scroll は #voiceList だけ**に持たせる */
  /* 設定も同じ形にする(PBI-009)。パネルは伸びず、内部 scroll を持つのは本体 1 つだけ */
  #voice.open, #settings.open, #roomAdmin.open { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px;
                max-height: 30dvh; overflow: hidden; }
  #settings > :not(#settingsBody), #roomAdmin > :not(#roomAdminBody) { flex-shrink: 0; }
  #roomAdminBody { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  #roomAdmin .rform { display: flex; flex-direction: column; gap: 8px; }
  #roomAdmin .rform input { min-height: 44px; width: 100%; padding: 8px 10px; border-radius: 10px;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  #roomAdmin .rform button, #roomAdmin .linkbtn { min-height: 44px; }
  #settingsBody { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  #voice > :not(#voiceList) { flex-shrink: 0; }
  #voice h2 { margin-bottom: 0; }   /* 間隔は gap が持つ(固定領域を 1px も無駄にしない) */
  /* min-height は「一覧の取り分が 0 になって行が panel の外へはみ出す」事故の底 —
     はみ出すと矩形が #log に重なり、会話を覆っていないという契約が崩れる(実測で踏んだ) */
  #voiceList { flex: 1; min-height: 88px; overflow-y: auto; overflow-x: hidden; }
  #voiceNow { font-size: var(--fs-small); line-height: 1.6; color: var(--muted); }
  #voiceNow b { color: var(--text); font-weight: 600; }
  #voiceNow .fallback { color: #ffc2d1; }
  .vctl { display: flex; gap: 8px; align-items: center; }
  #voiceSearch { flex: 1; min-width: 0; min-height: 44px; padding: 8px 10px; border-radius: 10px;
                 background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  #voiceSearch:focus { border-color: var(--accent); outline: none; }
  #voiceAll { min-height: 44px; padding: 0 12px; white-space: nowrap; border-radius: var(--r-sm);
              border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: var(--fs-small); }
  #voiceAll[aria-pressed="true"] { border-color: var(--accent); color: var(--text); }
  /* PBI-029: 役の切り替え。的は 44px(押し間違えない大きさ。#voiceAll と同じ規則) */
  #voiceRoles button { flex: 1; min-height: 44px; padding: 0 12px; border-radius: var(--r-sm);
              border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: var(--fs-small); }
  #voiceRoles button[aria-pressed="true"] { border-color: var(--accent); color: var(--text); }
  #voiceNote:empty { display: none; }
  #voiceNote { font-size: var(--fs-small); line-height: 1.6; color: #ffc2d1; }
  .vrow { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .vrow.on { outline: 1px solid var(--accent); outline-offset: -1px; border-radius: var(--r-sm); }
  /* 長い候補名は折り返して 2 行で省略。全体は title 属性で読める(AC-10) */
  .vrow .vname { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .vrow .vtitle { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere;
                  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .vrow .vsub { font-size: 12.5px; color: var(--muted); }
  .vrow button { min-width: 44px; min-height: 44px; padding: 0 10px; border-radius: var(--r-sm);
                 border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font-size: 13px; }
  .vrow button:hover:not([disabled]) { border-color: var(--accent); }
  .vrow button[disabled] { opacity: .4; cursor: default; }
  .vrow .verr { flex-basis: 100%; color: #ffc2d1; font-size: var(--fs-small); line-height: 1.5; }
  #voiceMore { width: 100%; min-height: 44px; margin-top: 6px; border-radius: var(--r-sm);
               border: 1px solid var(--line); background: var(--surface-2); color: var(--text); }
  /* 狭い画面では固定領域を削って一覧に回す(使い方は 🎙 ボタンの title に出る)。
     さらに声パネルを会話の「下」(入力欄のすぐ上)へ回す。内部 scroll する一覧は、
     画面外へ回った行の矩形が容器の外へ伸びる — 会話の上に置くとその伸びる先が #log になる。
     下に置けば伸びる向きが会話から離れ、**会話に重なる余地が構造的に消える**(実測で踏んだ) */

  /* 部屋一覧: 1 行 1 部屋。今いる部屋だけ縁と背景で立てる */
  .room { width: 100%; text-align: left; display: flex; align-items: center; gap: 10px;
          padding: 10px 13px; margin-bottom: 6px; border-radius: var(--r-sm);
          border: 1px solid transparent; background: transparent;
          font-size: 15px; font-weight: 600; line-height: 1.4; }
  .room .rmain { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .room .rmain b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room .rsub { font-size: 12.5px; font-weight: 400; color: var(--muted); line-height: 1.4;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room .rbadge { flex-shrink: 0; font-size: 12px; padding: 1px 7px; border-radius: 999px;
                  background: var(--surface-2); color: var(--muted); }
  .room:hover { background: var(--surface-2); }
  .room.here { background: #322850; border-color: var(--line); }
  .room .here-mark { margin-left: auto; flex-shrink: 0; font-size: 12.5px; font-weight: 700; letter-spacing: .06em;
                     color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 2px 9px; }
  #roomsExtra:empty { display: none; }   /* 新規作成・名前変更 UI のマウント先 */
  #roomsExtra { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--surface-2); }
  /* 部屋を作る / 名前を変える */
  .rform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .rform input { flex: 1 1 12em; min-width: 0; padding: 10px 14px; border-radius: var(--r-sm);
                 border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
                 font-size: var(--fs-ui); }
  .rform input:focus { border-color: var(--accent); outline: none; }
  .rform button { padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line);
                  background: var(--surface-2); color: var(--text); font-size: var(--fs-ui); font-weight: 600; }
  .rform button.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .rform button:hover { border-color: var(--accent); }

  /* この部屋の記録(ログ・アーカイブ)は部屋の道具なので、ヘッダでなくここに置く */
  .rlinks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding-top: 12px;
            border-top: 1px solid var(--surface-2); }
  .linkbtn { background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
             border-radius: 999px; padding: 7px 14px; font-size: var(--fs-small); }
  .linkbtn:hover { border-color: var(--accent); }

  /* ---- 相談中の案(合意するまで作業は始まらない)---- */
  #plan { display: none; margin: 10px var(--pad) 0; padding: 13px 15px; background: var(--surface);
          border: 1px solid var(--accent); border-radius: var(--r-md); }
  #plan.on { display: block; }
  #plan h3 { font-size: var(--fs-small); font-weight: 700; letter-spacing: .08em; color: var(--accent); margin-bottom: 6px; }
  #plan .psummary { font-size: 15px; line-height: 1.7; }
  #plan ol { margin: 8px 0 0 1.3em; padding: 0; color: var(--muted); font-size: var(--fs-ui); line-height: 1.8; }
  #plan .pacts { display: flex; gap: 8px; margin-top: 12px; }
  #plan button { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
                 background: var(--surface-2); font-size: var(--fs-ui); font-weight: 600; }
  #plan button.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #plan button:hover { border-color: var(--accent); }

  /* ---- 進捗の帯(常に見える。押すと作業ボードが開く)---- */
  #progress { display: none; width: calc(100% - var(--pad) * 2); margin: 10px var(--pad) 0;
              padding: 11px 14px; text-align: left; background: var(--surface);
              border: 1px solid var(--line); border-radius: var(--r-md); }
  #progress.on { display: block; }
  #progress:hover { border-color: var(--accent); }
  /* 状態の色は帯・凡例・タスク行で共通(同じ色 = 同じ意味) */
  .s-done { background: #4c9e68; } .s-working { background: var(--accent); }
  .s-queued { background: #4d4270; } .s-failed { background: #b0455f; }
  .pbar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: #2c2440; }
  .pbar i { display: block; height: 100%; transition: width .35s ease; } /* 件数が変わると滑らかに伸縮 */
  .pbar .s-working {
    background-image: linear-gradient(115deg, rgba(255,255,255,.34) 25%, transparent 25%, transparent 50%,
                                       rgba(255,255,255,.34) 50%, rgba(255,255,255,.34) 75%, transparent 75%);
    background-size: 16px 16px; animation: flow 1s linear infinite; }
  @keyframes flow { to { background-position: 16px 0; } }
  .plegend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 9px;
             font-size: var(--fs-small); line-height: 1.5; color: var(--muted); }
  .plegend span { display: inline-flex; align-items: center; gap: 5px; }
  .plegend b { color: var(--text); font-weight: 700; }
  .plegend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .pnote { display: block; margin-top: 7px; font-size: var(--fs-small); line-height: 1.6; color: var(--muted);
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 作業ボード: 状態 → 依頼 → 実況 の順に読ませる */
  .task { padding: 11px 0; border-bottom: 1px solid var(--surface-2); font-size: var(--fs-ui); line-height: 1.7; }
  .task:last-child { border-bottom: 0; }
  .task .tstat { display: inline-block; font-size: 12.5px; font-weight: 700; letter-spacing: .04em;
                 padding: 2px 9px; border-radius: 999px; background: #3a3052; margin-right: 8px; }
  .task .tstat.done { background: #2f6440; } .task .tstat.failed { background: #7a3345; }
  .task .tnote { display: block; margin: 4px 0 0 4px; padding-left: 10px; border-left: 2px solid var(--line);
                 color: var(--muted); font-size: var(--fs-small); line-height: 1.7;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task .treq { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* 自分で片付けるためのボタン(直す・やめる・消す)*/
  .tacts { display: flex; gap: 6px; margin-top: 7px; }
  .tact { background: transparent; border: 1px solid var(--line); color: var(--muted);
          border-radius: 999px; padding: 7px 13px; font-size: 12.5px; line-height: 1.5; min-height: 32px; }
  .tact:hover { border-color: var(--accent); color: var(--text); }
  .tedit { width: 100%; background: var(--surface-2); border: 1px solid var(--accent); color: var(--text);
           border-radius: var(--r-sm); padding: 6px 10px; font-size: var(--fs-small); }
  /* 選んでまとめて操作する(会話以外の一覧に共通)*/
  .pick { width: 18px; height: 18px; margin-right: 8px; padding: 12px; accent-color: var(--accent);
          vertical-align: middle; }
  .pickbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px;
             padding-top: 10px; border-top: 1px solid var(--surface-2);
             font-size: var(--fs-small); line-height: 1.5; color: var(--muted); }
  /* 在室チップに「今なにをしているか」を出す */
  .chip .busy { margin-left: 6px; padding: 1px 7px; border-radius: 999px;
                background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; }
  .task .tmeta { color: var(--muted); font-size: var(--fs-small); margin-left: 6px; }
  .task .tbar { display: block; height: 4px; margin-top: 7px; border-radius: 999px; background: #2c2440; overflow: hidden; }
  .task .tbar i { display: block; height: 100%; width: 100%; border-radius: 999px; }
  .task .tbar .s-working { width: 40%; animation: slide 1.6s ease-in-out infinite; }
  .task .tbar .s-queued { width: 12%; }
  @keyframes slide { 0% { margin-left: 0 } 50% { margin-left: 60% } 100% { margin-left: 0 } }
  .task a { color: var(--accent); }
  .tnote { color: var(--muted); font-size: var(--fs-small); line-height: 1.7; }

  /* 設定: ラベルと値を 1 行 1 項目で */
  /* label は「押せる範囲」そのもの(checkbox は label をタップしても効く)。44px を label で確保し、
     設定名は左・操作は右へ寄せて 1 行に収める(PBI-009 AC-1/2) */
  #settings label { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                    min-height: 44px; padding: 4px 0; color: var(--muted); font-size: var(--fs-ui); }
  #settings select, #settings input { background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 5px 10px; flex: none; }
  #settings select, #settings input[type="search"], #settings input[type="text"] { min-height: 44px; }
  /* checkbox は大きめに。的そのものは上の label(44px)が持つ */
  #settings input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); }
  /* 辞書・記憶の編集欄と消すボタンも押せる大きさに */
  .editlist input, .editlist button, .erow button { min-height: 44px; }
  #settings .tnote { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--surface-2); }
  /* 覚えたこと・言い換え表: 見て消せるようにする */
  .editlist { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--surface-2); }
  .editlist > b { display: block; font-size: var(--fs-small); font-weight: 700; color: var(--muted);
                  letter-spacing: .06em; margin-bottom: 8px; }
  .erow { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: var(--fs-small); line-height: 1.6; }
  .erow > span:first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .erow .tnote { margin: 0; padding: 0; border: 0; flex: none; }
  .editlist .tedit { margin-top: 6px; }

  /* ---- 会話ログ: 吹き出しをやめ、発話 1 件 = 1 行にする ----
     ① 文を連結しない(どの文がいつ話されたかが残る)
     ② .turn = 1 つの依頼とその返答のまとまり。左の罫線で「どこへの返答か」が見える
     ③ どの依頼にも属さない発話(実況・警告)は罫線の外に出す = 文脈が混ざらない */
  #log { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
         padding: 18px var(--pad); scroll-padding-bottom: 16px;
         display: flex; flex-direction: column; }
  .turn { display: flex; flex-direction: column; margin: 6px 0;
          padding-left: 13px; border-left: 2px solid var(--line); }
  .turn:hover { border-left-color: var(--accent); }
  /* 話者の見出し(時刻 + 名前)。連続する発話ではこれを出さず、行だけを積む */
  .spk { display: flex; align-items: baseline; gap: 9px; margin: 13px 0 3px; }
  .turn > .spk:first-child { margin-top: 2px; }
  .spk .tm { font-size: var(--fs-small); line-height: 1.5; color: var(--muted); font-variant-numeric: tabular-nums; }
  .spk .nm { font-size: var(--fs-ui); line-height: 1.5; font-weight: 700; letter-spacing: .04em; color: var(--accent); }
  .spk .to { font-size: var(--fs-small); line-height: 1.5; color: var(--muted); }
  .spk.me .nm { color: #9dc4ff; }
  .tx { max-width: var(--measure); margin-left: 3.7em; line-height: 1.85;
        white-space: pre-wrap; overflow-wrap: anywhere; }
  /* 読み上げ中はその 1 行だけ光る(どこを喋っているかが分かる)。outline なので行がずれない */
  .tx.speaking { outline: 1px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  .tx a { color: var(--accent); }
  .tx code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .93em; }
  /* システム行 = 話者の発言ではない案内。区切りとして左右に線を引く */
  .sys { align-self: center; display: flex; align-items: center; gap: 10px; width: 100%;
         margin: 6px 0; color: var(--muted); font-size: var(--fs-small); line-height: 1.6; text-align: center; }
  .sys::before, .sys::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .sys a { color: var(--accent); }
  .interim { margin: 4px 0 0 3.7em; max-width: var(--measure);
             color: var(--muted); font-size: 15px; line-height: 1.8; }

  /* ---- 入力 ---- */
  /* 入力欄がこの画面の主役。道具は欄の中に収める(外に散らばらせない)*/
  footer { padding: 12px var(--pad) calc(12px + env(safe-area-inset-bottom)); border-top: 0; }
  #composer { width: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px;
              padding: 10px 12px; border-radius: var(--r-lg); border: 1px solid var(--line);
              background: var(--surface); box-shadow: 0 6px 20px -12px rgba(0,0,0,.7); }
  #composer:focus-within { border-color: var(--accent); }
  #composer.drop { border-color: var(--accent); }
  .ctools { display: flex; align-items: center; gap: 4px; }
  .cspacer { flex: 1; }
  #mic { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--surface-2);
         font-size: 18px; flex-shrink: 0; transition: background .2s, transform .2s; }
  #mic.on { background: var(--accent); color: var(--accent-ink); }
  #mic.listening { background: var(--hot); color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  #text { width: 100%; min-width: 0; min-height: 44px; padding: 10px 6px 6px; border: 0;
          background: transparent; font-size: var(--fs-body); line-height: 1.6; outline: none; }
  /* 送る前の添付。押すと外せる */
  #attached:empty { display: none; }
  #attached { display: flex; flex-wrap: wrap; gap: 8px; }
  #attached button { display: flex; align-items: center; gap: 6px; max-width: 16em;
                     padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line);
                     background: var(--surface-2); color: var(--text); font-size: var(--fs-small); line-height: 1.5; }
  #attached button:hover { border-color: var(--hot); }
  #attached img { width: 26px; height: 20px; object-fit: cover; border-radius: 3px; background: #fff; }
  #attached span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 送った添付(会話の中)*/
  .att { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 0 3.7em; max-width: var(--measure); }
  .att .shot { width: auto; max-width: 220px; max-height: 140px; margin-top: 0; }
  .att a { color: var(--accent); font-size: var(--fs-small); align-self: center; }

  /* ---- ゲーム: 声で言えることは全部ボタンでも押せるようにする ---- */
  #gameList h3 { font-size: var(--fs-ui); font-weight: 700; line-height: 1.6; margin-bottom: 6px; }
  /* 成果物タブから遊べるようにする(遊べるものも「見て分かる成果物」なので)*/
  .playbox { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--surface-2); }
  .playbox > b { display: block; font-size: var(--fs-small); font-weight: 700; color: var(--muted);
                 letter-spacing: .06em; margin-bottom: 8px; }
  #gameList .gstate { font-size: var(--fs-small); line-height: 1.8; color: var(--muted); margin-bottom: 10px; }
  #gameList .gstate b { color: var(--text); font-weight: 400; }
  .gmoves { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .gmove { background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
           border-radius: 999px; padding: 8px 16px; font-size: var(--fs-ui); font-weight: 600; line-height: 1.4; }
  .gmove:hover { border-color: var(--accent); }
  .gmove.hot { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  /* 札と牌: 実物らしく見せる。押せるものだけ浮く */
  .grow-label { font-size: var(--fs-small); color: var(--muted); margin: 8px 0 4px; }
  .gcards { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .gcard { display: inline-flex; align-items: center; justify-content: center;
           min-width: 42px; height: 58px; padding: 0 6px; border-radius: 6px;
           background: #fdfcf8; color: #17111f; border: 1px solid #b9b0c4;
           box-shadow: 0 2px 5px rgba(0,0,0,.35); font-size: 17px; font-weight: 700; line-height: 1.1; }
  .gcard.red { color: #c62c46; }
  .gcard.back { background: repeating-linear-gradient(45deg, #4a3f74, #4a3f74 5px, #3a3060 5px, #3a3060 10px);
                border-color: #2a2240; color: transparent; box-shadow: none; }
  /* ---- 麻雀の卓: 自分から見た向きで 4 人ぶんの河を並べる ----
     河は 6 枚 3 段。各家が自分の向きに捨てるので、上下左右で回してある。
     大きさを固定してあるので、どれだけ捨ててもスクロールしない */
  .mjtable { display: grid; gap: 4px; padding: 10px; margin-bottom: 10px; border-radius: var(--r-md);
             /* 河 6×3 = 154×94。回すと 94×154。外側の列/行は 94 + 名前ぶん、
                中央は 154 を確保する。卓ごとレーンに収まる大きさで固定 */
             grid-template-columns: 124px minmax(164px, 1fr) 124px;
             grid-template-rows: 128px minmax(164px, 1fr) 128px;
             background: radial-gradient(ellipse at center, #1d5c40 0%, #123c2a 100%);
             border: 1px solid #0d2a1d; box-shadow: inset 0 0 30px rgba(0,0,0,.45); }
  .mjseat { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 0; }
  .at-top    { grid-area: 1 / 2; }
  .at-left   { grid-area: 2 / 1; }
  .at-right  { grid-area: 2 / 3; }
  .at-self   { grid-area: 3 / 2; }
  .mjcenter  { grid-area: 2 / 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
               gap: 2px; font-size: 12.5px; line-height: 1.5; color: #cfe8db; text-align: center; }
  .mjcenter b { font-size: 13.5px; color: #fff; font-weight: 700; }
  .mjwho { font-size: 12.5px; line-height: 1.4; color: #cfe8db; white-space: nowrap;
           overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .mjseat.turn .mjwho { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,.55); }
  .mjwind { display: inline-block; min-width: 15px; text-align: center; border-radius: 3px;
            background: rgba(255,255,255,.16); font-weight: 700; }
  .mjwind.dealer { background: #d8b43c; color: #1a1206; }
  .mjriichi { margin-left: 4px; padding: 0 5px; border-radius: 3px; background: #d94f6e; color: #fff; font-size: 12px; }
  /* 河の入れ物は大きさを固定し、中身だけ回す(回しても場所を食い合わない)*/
  .mjriverbox { display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  /* 入れ物は回した後の実寸ぴったりに取る(はみ出させない)*/
  .at-top .mjriverbox, .at-self .mjriverbox { width: 162px; height: 102px; }
  .at-left .mjriverbox, .at-right .mjriverbox { width: 102px; height: 162px; }
  .mjriver { display: grid; grid-template-columns: repeat(6, 24px); gap: 2px; }
  .at-top .mjriver   { transform: rotate(180deg); }
  .at-left .mjriver  { transform: rotate(90deg); }
  .at-right .mjriver { transform: rotate(-90deg); }
  .rtile { display: flex; align-items: center; justify-content: center; width: 24px; height: 30px;
           border-radius: 3px; background: linear-gradient(#fdfbf4, #ece5d5); color: #17111f;
           border: 1px solid #b3a685; font-size: 12px; font-weight: 700; line-height: 1;
           letter-spacing: -.1em; }

  /* 晒した面子(鳴き)。誰にでも見えるので河のそばに小さく置く */
  .mjmelds { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-width: 100%; }
  .mjmeld { display: flex; gap: 1px; }
  .rtile.open { width: 18px; height: 23px; font-size: 12px; border-color: #d8b43c; }

  /* 麻雀の牌 */
  .gtiles { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .gtile { display: inline-flex; align-items: center; justify-content: center;
           min-width: 38px; height: 52px; padding: 0 4px; border-radius: 5px;
           background: linear-gradient(#fdfbf4, #efe9db); color: #17111f;
           border: 1px solid #c3b79c; border-bottom: 3px solid #b3a685;
           font-size: 14px; font-weight: 700; line-height: 1.2; }
  .gtile.drawn { margin-left: 10px; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(205,178,255,.5); } /* ツモ牌は離す */
  .gtile.can:hover, .gcard.can:hover { transform: translateY(-4px); border-color: var(--accent); }
  .gtile.can, .gcard.can { cursor: pointer; }
  #gameList details { margin-top: 6px; }
  #gameList summary { cursor: pointer; color: var(--muted); font-size: var(--fs-small); }
  #gameList .grules { margin-top: 6px; font-size: var(--fs-small); line-height: 1.8; color: var(--muted); }
  #text::placeholder { color: var(--muted); }
  #text:focus { border-color: var(--accent); }
  #send { width: 44px; height: 44px; border-radius: 50%; border: 0;
          background: var(--accent); color: var(--accent-ink); font-size: 16px; flex-shrink: 0; }
  #send:hover { filter: brightness(1.1); }

  /* ---- 報告スレッドと成果物プレビュー(右レーンの中身)---- */
  .tabs { display: flex; gap: 8px; margin: 0 0 10px; }
  .tab { background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
         border-radius: var(--r-sm); padding: 5px 13px; font-size: var(--fs-small); line-height: 1.5; }
  .tab:hover { border-color: var(--accent); }
  .tab.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .thread { padding: 12px 0; border-bottom: 1px solid var(--surface-2); }
  .thread:last-child { border-bottom: 0; }
  .thread.unread { border-left: 3px solid var(--accent); padding-left: 10px; }
  .thread h3 { font-size: var(--fs-ui); line-height: 1.6; margin: 0 0 4px; font-weight: 700; }
  .thread .req { font-size: var(--fs-small); line-height: 1.6; color: var(--muted); margin-bottom: 8px; }
  .thread .sec { font-size: var(--fs-small); line-height: 1.7; margin: 6px 0 0; }
  .thread .sec b { color: var(--accent); font-weight: 700; display: block; margin-bottom: 2px; }
  .thread ul { margin: 0; padding-left: 18px; }
  .thread .warn { color: var(--hot); }
  .thread a { color: var(--accent); }
  .thread .actions { display: flex; gap: 8px; margin-top: 10px; }
  .thread input { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--line);
                  color: var(--text); border-radius: var(--r-sm); padding: 7px 12px; font-size: var(--fs-small); }
  .thread input:focus { border-color: var(--accent); outline: none; }
  /* 未読の報告は赤丸 + 件数。タブにも 📋 にも同じ形で出す(見落とさないように)*/
  #inboxCount:not(:empty), .badge:not(:empty) {
    display: inline-block; min-width: 19px; padding: 0 5px; border-radius: 999px;
    background: #e5484d; color: #fff; font-size: 12.5px; font-weight: 700;
    line-height: 19px; text-align: center; }
  .hbtn { position: relative; }
  /* PBI-040: ゲストの画面。**押しても 403 になる物は最初から出さない**
     （分岐を JS に散らさず、body.guest の 1 箇所で決める） */
  body.guest #boardBtn, body.guest #voiceBtn, body.guest #settingsBtn,
  body.guest #roster, body.guest #attach, body.guest #logBtn,
  body.guest #roomsExtra, body.guest #railTools, body.guest #personaBtn { display: none !important; }
  body.guest #roomList .room:not(.here) { display: none; }
  body.guest #roomList .rgroup, body.guest #attachBtn { display: none; }
  #boardBadge:not(:empty) { position: absolute; top: 0; right: 0; transform: translate(35%, -25%); }
  #preview { display: none; flex-direction: column; margin: 0 var(--pad) 8px; border: 1px solid var(--line);
             border-radius: var(--r-md); overflow: hidden; background: var(--surface); height: 42dvh; flex: none; }
  #preview.open { display: flex; }
  #preview .phead { display: flex; gap: 10px; align-items: center; padding: 8px 12px;
                    font-size: var(--fs-small); line-height: 1.5; color: var(--muted); }
  #preview .phead a { color: var(--accent); margin-left: auto; }
  #preview iframe { flex: 1; border: 0; background: #fff; width: 100%; }

  /* ---- 成果物: 会話の中に絵として出す / 右レーンに一覧する ----
     「どんなものができたのか」を path の羅列ではなく現物で見せる */
  .card { margin: 10px 0 10px 3.7em; max-width: var(--measure); padding: 12px 14px;
          background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
  .card .chead { font-size: var(--fs-ui); font-weight: 700; line-height: 1.6; }
  .card .cwhat { margin-top: 3px; color: var(--muted); font-size: var(--fs-small); line-height: 1.7; }
  .shot { display: block; width: 100%; max-height: 190px; object-fit: contain; object-position: left;
          margin-top: 10px; border-radius: var(--r-sm); background: #fff; cursor: zoom-in; }
  .files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .files a { display: inline-flex; align-items: center; min-height: 36px; padding: 7px 13px;
             border-radius: 999px; background: var(--surface-2);
             border: 1px solid var(--line); color: var(--text); font-size: var(--fs-small); line-height: 1.5;
             text-decoration: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files a:hover { border-color: var(--accent); }


  /* ---- 三分割レイアウト: 左=ナビ / 中央=会話 / 右=作業スペース ----
     広げるためではなく「会話を消さない」ための配置(CLAUDE.md ルール 2)。
     成果物もボードも中央の外にあるので、何を開いても会話は 1px も動かない。
     1099px 以下では .lane を display:contents に戻し、今までの 1 カラムに縮退する */
  .lane { display: contents; }

  /* ---- PBI-042: 卓モード（遊んでいる間は Zoom のような画面）----
     上に参加者の窓、下に大きな卓。会話ログと入力欄は出さない（遊びに集中する画面）。
     切替は body.table の 1 クラスで、置き場所は全部ここ */
  body.table #log, body.table #composer, body.table #notice, body.table #plan,
  body.table #rooms, body.table #voice, body.table #settings, body.table #roomAdmin { display: none !important; }
  body.table #board .tabs { display: none; }
  body.table #avatar { display: block; }
  body.table #seatBar { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 4px 0 2px; }
  body.table #seatBar .seat { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
                              background: var(--surface-2); color: var(--muted); font-size: var(--fs-small); white-space: nowrap; }
  body.table #seatBar .seat.turn { border-color: var(--accent); color: var(--text); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  body.table #seatBar .seat.you { font-weight: 600; }
  /* 参加者の帯は**卓より小さく**保つ（主役は卓。AC-4） */
  body.table #avatarCanvas { height: min(17vh, 150px); max-height: 150px; }
  body.table #avatar { padding: 4px 10px 6px; margin-top: 4px; max-height: none; overflow: visible; }
  body.table #avatar h2, body.table #avatarNote { display: none; }
  /* 話す相手の選択もトーク UI なので出さない（遊びに集中する画面） */
  body.table header #roster, body.table #motionBar { display: none; }

    .lane > * { margin: 0 var(--pad); width: auto; max-height: none; flex-shrink: 0; }
    /* 幅変更の掴み手。上の `.lane > * { width: auto }` と同じ詳細度で後ろに負けて **0px = 掴めない**

    /* 声と設定は広い画面でも開閉する(常設だと会話スペースを常に食う)。max-height の打ち消しを

  /* 指で押す幅では触れる的を 44px に上げる。広い画面は主にマウスなので、

  @media (max-width: 1099px) {

  @media (max-width: 1099px) {

    <button id="previewClose" class="hbtn">✕</button>
    <span id="previewTitle"></span>
    <a id="previewOpen" target="_blank">別タブで開く</a>
  </div>
  <iframe id="previewFrame" title="成果物プレビュー"></iframe>
</div>
</aside>
<!-- 会話は読み上げの対象。声の部屋なので、増えた行が読み上げられないと意味がない -->
<main id="log" aria-live="polite" aria-relevant="additions" aria-label="会話"></main>
<footer>
  <!-- PBI-024: 覚える価値のありそうな語を聞く。候補が無い時は出ない。会話ログを覆わない(composer の上) -->
  <div id="vocabBar" hidden aria-live="polite"></div>
  <div id="composer">
    <div id="attached"></div>
    <input id="text" placeholder="話しかけてね(画像やファイルはドロップ・貼り付けでも送れるよ)" autocomplete="off">
    <div class="ctools">
      <button id="attachBtn" class="hbtn" title="画像やファイルを送る">📎</button>
      <button id="stopBtn" class="hbtn" title="読み上げを止める">⏹</button>
      <span class="cspacer"></span>
      <button id="mic" title="ハンズフリー会話 ON/OFF">🎤</button>
      <button id="send" title="送信">➤</button>
    </div>
  </div>
  <input id="fileInput" type="file" multiple hidden>
</footer>
<script src="/vad/vad-web.js"></script>
<script src="/room.js"></script>
</body>
</html>
