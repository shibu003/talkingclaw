<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; media-src 'self'; img-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'none'">
<meta name="room-token" content="__ROOM_TOKEN__">
<meta name="room-boot" content="__BOOT_ID__">
<title>talkingclaw — 声の部屋</title>
<style>
  /* 声の部屋のデザイン。読みやすさ優先 —
     ① 文字は本文 16px / 行間 1.8 / 和文に少し字間、② 1 行は 32em 以内、
     ③ 階層は「大きさ」より「余白と色」で作る。色・寸法はこの変数だけ触れば全体が揃う */
  :root {
    color-scheme: dark;
    --bg: #14101c; --surface: #1d1729; --surface-2: #251e35; --line: #3a3052;
    --text: #f1edf8; --muted: #ab9fc9; --accent: #c3a4ff; --accent-ink: #1a1426; --hot: #f0688f;
    --r-sm: 8px; --r-md: 14px; --r-lg: 20px; --pad: 18px;
    --fs-body: 16px; --fs-ui: 14px; --fs-small: 12.5px;
    --measure: 32em;   /* 1 行の最大文字数(和文で読み疲れない幅) */
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
         background: var(--bg); color: var(--text);
         font-size: var(--fs-body); line-height: 1.8; letter-spacing: .015em;
         display: flex; flex-direction: column; height: 100dvh; max-width: 860px; margin: 0 auto;
         -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- ヘッダ: いる部屋の名前が最上位。状態と道具はその下の階層 ---- */
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
           padding: 12px var(--pad); border-bottom: 1px solid var(--line); }
  #roomBtn { display: flex; align-items: baseline; gap: 8px; max-width: 58vw;
             padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line);
             background: var(--surface-2); font-size: 17px; font-weight: 700; line-height: 1.3; }
  #roomBtn:hover { border-color: var(--accent); }
  #roomBtn .rname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #roomBtn .caret { color: var(--muted); font-size: 10px; }
  #status { font-size: var(--fs-small); line-height: 1.5; color: var(--muted); margin-left: auto; text-align: right; }
  .tools { display: flex; gap: 2px; }
  .hbtn { background: transparent; border: 1px solid transparent; color: var(--muted);
          border-radius: var(--r-sm); padding: 7px 10px; font-size: 16px; line-height: 1; }
  .hbtn:hover { background: var(--surface-2); color: var(--text); }
  .hbtn[aria-expanded="true"] { background: var(--surface-2); border-color: var(--accent); color: var(--text); }

  #notice { margin: 10px var(--pad) 0; padding: 10px 14px; border-radius: var(--r-sm);
            background: #3d1c2b; color: #ffc2d1; font-size: var(--fs-ui); line-height: 1.7; display: none; }

  /* ---- 話す相手 ---- */
  #roster { display: flex; gap: 6px; padding: 10px var(--pad) 0; flex-wrap: wrap; align-items: center; }
  #roster .label { font-size: var(--fs-small); color: var(--muted); margin-right: 2px; }
  .chip { padding: 5px 13px; border-radius: 999px; background: var(--surface-2); color: var(--muted);
          font-size: var(--fs-small); line-height: 1.5; cursor: pointer; border: 1px solid var(--line); user-select: none; }
  .chip:hover { border-color: var(--accent); }
  .chip.active { color: var(--text); }
  .chip.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .chip.gone { opacity: .5; }

  /* ---- パネル(部屋・ボード・設定は同時に 1 枚だけ)---- */
  .panel { display: none; margin: 10px var(--pad) 0; padding: 14px 16px; background: var(--surface);
           border: 1px solid var(--line); border-radius: var(--r-md);
           font-size: var(--fs-ui); max-height: 44dvh; overflow-y: auto; }
  .panel.open { display: block; }
  .panel h2 { display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
              font-size: var(--fs-small); font-weight: 700; letter-spacing: .1em; color: var(--muted); }
  .panel h2::before { content: ""; width: 3px; height: 13px; border-radius: 2px; background: var(--accent); }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--surface-2); }
  .row:last-child { border-bottom: 0; }

  /* 部屋一覧: 1 行 1 部屋。今いる部屋だけ縁と背景で立てる */
  .room { width: 100%; text-align: left; display: flex; align-items: center; gap: 10px;
          padding: 12px 14px; margin-bottom: 8px; border-radius: var(--r-sm);
          border: 1px solid var(--line); background: var(--surface-2);
          font-size: 15px; font-weight: 600; line-height: 1.5; }
  .room:hover { border-color: var(--accent); }
  .room.here { border-color: var(--accent); background: #322850; }
  .room .here-mark { margin-left: auto; flex-shrink: 0; font-size: 11px; font-weight: 700; letter-spacing: .06em;
                     color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 2px 9px; }
  #roomsExtra:empty { display: none; }   /* 新規作成・名前変更 UI のマウント先 */
  #roomsExtra { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--surface-2); }

  /* 作業ボード: 状態 → 依頼 → 実況 の順に読ませる */
  .task { padding: 11px 0; border-bottom: 1px solid var(--surface-2); font-size: var(--fs-ui); line-height: 1.7; }
  .task:last-child { border-bottom: 0; }
  .task .tstat { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em;
                 padding: 2px 9px; border-radius: 999px; background: #3a3052; margin-right: 8px; }
  .task .tstat.done { background: #2f6440; } .task .tstat.failed { background: #7a3345; }
  .task .tnote { display: block; margin: 4px 0 0 4px; padding-left: 10px; border-left: 2px solid var(--line);
                 color: var(--muted); font-size: var(--fs-small); line-height: 1.7; }
  .task a { color: var(--accent); }
  .tnote { color: var(--muted); font-size: var(--fs-small); line-height: 1.7; }

  /* 設定: ラベルと値を 1 行 1 項目で */
  #settings label { display: flex; align-items: center; gap: 10px; padding: 7px 0;
                    color: var(--muted); font-size: var(--fs-ui); }
  #settings select, #settings input { background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 5px 10px; }
  #settings .tnote { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--surface-2); }

  /* ---- 会話ログ ---- */
  #log { flex: 1; overflow-y: auto; padding: 16px var(--pad); scroll-padding-bottom: 16px;
         display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: min(84%, var(--measure)); padding: 12px 16px; border-radius: var(--r-lg);
         line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: #453a63; border-bottom-right-radius: 5px; }
  .agent { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 5px; }
  .agent.speaking { box-shadow: 0 0 0 1px var(--accent), 0 0 20px -6px var(--accent); }
  .agent .who { display: block; margin-bottom: 4px; font-size: var(--fs-small); font-weight: 700;
                letter-spacing: .04em; color: var(--accent); line-height: 1.4; }
  .user .to { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); text-align: right; line-height: 1.4; }
  /* システム行 = 話者の発言ではない案内。区切りとして左右に線を引く */
  .sys { align-self: center; display: flex; align-items: center; gap: 10px; width: 100%;
         margin: 2px 0; color: var(--muted); font-size: var(--fs-small); line-height: 1.6; text-align: center; }
  .sys::before, .sys::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .sys a { color: var(--accent); }
  .interim { align-self: flex-end; max-width: min(84%, var(--measure)); padding: 0 16px;
             color: var(--muted); font-size: 15px; line-height: 1.8; }

  /* ---- 入力 ---- */
  footer { padding: 12px var(--pad) calc(12px + env(safe-area-inset-bottom));
           display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); }
  #mic { width: 56px; height: 56px; border-radius: 50%; border: none; background: var(--surface-2);
         font-size: 24px; flex-shrink: 0; transition: background .2s, transform .2s; }
  #mic.on { background: var(--accent); color: var(--accent-ink); }
  #mic.listening { background: var(--hot); color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  #text { flex: 1; min-width: 0; padding: 14px 18px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--surface-2); font-size: var(--fs-body); line-height: 1.5; outline: none; }
  #text::placeholder { color: var(--muted); }
  #text:focus { border-color: var(--accent); }
  #send { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line);
          background: var(--surface-2); font-size: 17px; flex-shrink: 0; }
  #send:hover { border-color: var(--accent); }

  /* ---- 成果物プレビュー ---- */
  #preview { display: none; position: fixed; right: 0; top: 0; width: min(560px, 92vw); height: 100dvh;
             background: var(--surface); border-left: 1px solid var(--line); z-index: 10; flex-direction: column; }
  #preview.open { display: flex; }
  #preview .phead { display: flex; gap: 10px; align-items: center; padding: 12px 14px;
                    font-size: var(--fs-ui); border-bottom: 1px solid var(--line); }
  #preview .phead #previewTitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #preview .phead a { color: var(--accent); margin-left: auto; flex-shrink: 0; }
  #preview iframe { flex: 1; border: 0; background: #fff; }

  @media (max-width: 480px) { :root { --pad: 14px; } #roomBtn { max-width: 100%; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <button id="roomBtn" title="部屋を選ぶ" aria-expanded="false">
    <span class="rname">部屋</span><span class="caret">▼</span>
  </button>
  <div id="status">接続中…</div>
  <div class="tools">
    <button id="boardBtn" class="hbtn" title="作業ボード" aria-expanded="false">📋</button>
    <button id="settingsBtn" class="hbtn" title="設定" aria-expanded="false">⚙</button>
    <button id="logBtn" class="hbtn" title="この部屋の会話ログ">📄</button>
    <button id="archiveBtn" class="hbtn" title="アーカイブ一覧">🗄</button>
  </div>
</header>
<div id="notice"></div>
<div id="roster"></div>
<div id="rooms" class="panel">
  <h2>部屋</h2>
  <div id="roomList"></div>
  <!-- 部屋の作成 / 名前変更の操作部品はここに載せる。音声ナビからも押せるよう
       data-voice="create-room" / "rename-room" / "room-name-input" を付けること -->
  <div id="roomsExtra"></div>
  <p class="tnote">話しかけても動かせるよ —「部屋一覧見せて」「◯◯部屋に行って」「新しい部屋作って」</p>
</div>
<div id="board" class="panel"><h2>作業ボード</h2><div id="boardList"></div></div>
<div id="settings" class="panel"><h2>設定</h2><div id="settingsBody"></div></div>
<div id="preview">
  <div class="phead">
    <button id="previewClose" class="hbtn">✕</button>
    <span id="previewTitle"></span>
    <a id="previewOpen" target="_blank">別タブで開く</a>
  </div>
  <iframe id="previewFrame" title="成果物プレビュー"></iframe>
</div>
<div id="log"></div>
<footer>
  <button id="mic" title="ハンズフリー会話 ON/OFF">🎤</button>
  <input id="text" placeholder="話しかけてね(「部屋一覧見せて」で画面も動くよ)" autocomplete="off">
  <button id="send" title="送信">➤</button>
</footer>
<script src="/vad/vad-web.js"></script>
<script src="/room.js"></script>
</body>
</html>
